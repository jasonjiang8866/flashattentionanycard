name: RunPod GPU smoke cleanup recovery
on:
  workflow_run:
    workflows: ['RunPod GPU smoke ($1 authorization)']
    types: [completed]
permissions:
  contents: read
jobs:
  cleanup:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile and remove only the originating run's owned temporary Pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ORIGIN_RUN_ID: ${{ github.event.workflow_run.id }}
        run: GITHUB_RUN_ID="$ORIGIN_RUN_ID" python -m runpod.paid_smoke cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runpod-cleanup-${{ github.event.workflow_run.id }}
          path: runpod-results/
          retention-days: 30
          if-no-files-found: warn
