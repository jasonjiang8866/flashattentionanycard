name: CPU regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        optuna: ['4.5.0', '4.9.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install optuna==${{ matrix.optuna }} 'pandas>=2.2,<4' 'matplotlib>=3.8,<4' 'seaborn>=0.13,<1' 'typer>=0.12,<1' 'rich>=13,<15' 'pytest>=8,<10' ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q -m 'not gpu and not compile'
      - run: python -m bo_kernel_tuner.run_benchmark --dry-run --kernel moe_grouped_gemm
  offline-triton:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install 'triton==3.5.0' 'pytest>=8,<10'
      - run: python -m pytest -q bo_kernel_tuner/tests/test_compile.py
